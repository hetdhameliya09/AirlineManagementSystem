<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle} ?: 'SkyWays | Modern Airline Management System'">SkyWays | Modern Airline Management System</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-navy: #0b132b;
            --secondary-navy: #1c2541;
            --accent-blue: #3a506b;
            --sky-cyan: #00b4d8;
            --sky-cyan-light: #90e0ef;
            --bg-body: #f4f7fc;
            --card-shadow: 0 12px 30px rgba(11, 19, 43, 0.06);
            --glass-bg: rgba(255, 255, 255, 0.85);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            color: #2b2d42;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar-custom {
            background: linear-gradient(135deg, var(--primary-navy) 0%, var(--secondary-navy) 100%);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            padding: 0.8rem 0;
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: -0.5px;
            color: #ffffff !important;
        }

        .navbar-brand i {
            color: var(--sky-cyan);
        }

        .card-custom {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card-custom:hover {
            box-shadow: 0 16px 36px rgba(11, 19, 43, 0.1);
        }

        .btn-sky {
            background-color: var(--sky-cyan);
            color: #ffffff;
            font-weight: 600;
            border-radius: 10px;
            padding: 0.6rem 1.2rem;
            border: none;
            transition: all 0.2s;
        }

        .btn-sky:hover {
            background-color: #0077b6;
            color: #ffffff;
            transform: translateY(-1px);
        }

        .btn-navy {
            background-color: var(--secondary-navy);
            color: #ffffff;
            font-weight: 600;
            border-radius: 10px;
            padding: 0.6rem 1.2rem;
            border: none;
            transition: all 0.2s;
        }

        .btn-navy:hover {
            background-color: var(--primary-navy);
            color: #ffffff;
        }

        .badge-status {
            font-weight: 600;
            padding: 0.4em 0.8em;
            border-radius: 20px;
            font-size: 0.78rem;
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        footer {
            margin-top: auto;
            background: var(--primary-navy);
            color: #a0aec0;
            padding: 2rem 0 1.5rem 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <i class="fa-solid fa-plane-departure"></i> SkyWays Airlines
            </a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="/"><i class="fa-solid fa-house me-1"></i> Home</a>
                    </li>
                    <th:block th:if="${session.userRole == 'CUSTOMER'}">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/customer/dashboard"><i class="fa-solid fa-gauge-high me-1"></i> My Dashboard</a>
                        </li>
                    </th:block>
                    <th:block th:if="${session.userRole == 'ADMIN'}">
                        <li class="nav-item">
                            <a class="nav-link text-warning fw-semibold" href="/admin/dashboard"><i class="fa-solid fa-user-shield me-1"></i> Admin Portal</a>
                        </li>
                    </th:block>
                </ul>

                <div class="d-flex align-items-center gap-2">
                    <th:block th:if="${session.username == null}">
                        <a class="btn btn-outline-light btn-sm px-3 rounded-pill" href="/login"><i class="fa-solid fa-right-to-bracket me-1"></i> Login</a>
                        <a class="btn btn-sky btn-sm px-3 rounded-pill" href="/register"><i class="fa-solid fa-user-plus me-1"></i> Register</a>
                    </th:block>
                    <th:block th:if="${session.username != null}">
                        <div class="dropdown">
                            <button class="btn btn-light btn-sm dropdown-toggle rounded-pill px-3 fw-semibold" type="button" data-bs-toggle="dropdown">
                                <i class="fa-solid fa-circle-user me-1 text-primary"></i> <span th:text="${session.username}">User</span>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2">
                                <li th:if="${session.userRole == 'CUSTOMER'}">
                                    <a class="dropdown-item" href="/customer/dashboard"><i class="fa-solid fa-ticket me-2"></i> My Bookings</a>
                                </li>
                                <li th:if="${session.userRole == 'ADMIN'}">
                                    <a class="dropdown-item text-warning fw-semibold" href="/admin/dashboard"><i class="fa-solid fa-sliders me-2"></i> Admin Control</a>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item text-danger" href="/logout"><i class="fa-solid fa-power-off me-2"></i> Logout</a></li>
                            </ul>
                        </div>
                    </th:block>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="py-4">
        <div th:replace="${content}">
            <!-- Dynamic Page Content -->
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p class="mb-1 fw-medium text-white-50">&copy; 2026 SkyWays Airline Management System. All Rights Reserved.</p>
            <small class="text-white-50"><i class="fa-solid fa-shield-halved me-1"></i> Fast, Secure & Responsive Airline Experience</small>
        </div>
    </footer>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
