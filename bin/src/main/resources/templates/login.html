<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | SkyWays Airlines</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0b132b 0%, #1c2541 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .login-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            max-width: 440px;
            width: 100%;
            padding: 2.5rem;
        }
        .btn-sky { background-color: #00b4d8; color: #ffffff; font-weight: 600; border-radius: 12px; }
        .btn-sky:hover { background-color: #0077b6; color: #ffffff; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <a href="/" class="text-decoration-none">
                <div class="fs-2 text-primary fw-extrabold mb-1"><i class="fa-solid fa-plane-departure"></i> SkyWays</div>
            </a>
            <h4 class="fw-bold text-dark mb-1">Welcome Back</h4>
            <p class="text-secondary small">Login to access your airline portal and bookings.</p>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 text-start small mb-4" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-1"></i> <span th:text="${error}">Invalid username or password</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show rounded-3 text-start small mb-4" role="alert">
            <i class="fa-solid fa-circle-check me-1"></i> <span th:text="${success}">Success</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form method="post" action="/login">
            <div class="mb-3">
                <label class="form-label text-secondary fw-medium small">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-secondary"></i></span>
                    <input type="text" name="username" class="form-control bg-light border-start-0 py-2" placeholder="e.g. rohan_raj or admin" required autofocus />
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-secondary fw-medium small">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-secondary"></i></span>
                    <input type="password" name="password" class="form-control bg-light border-start-0 py-2" placeholder="••••••••" required />
                </div>
            </div>

            <button type="submit" class="btn btn-sky w-100 py-2.5 fs-6 shadow-sm mb-3">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Log In
            </button>
        </form>

        <div class="p-3 bg-light rounded-3 mb-3 text-center">
            <small class="text-secondary d-block fw-semibold mb-1"><i class="fa-solid fa-key me-1"></i> Demo Credentials</small>
            <div class="d-flex justify-content-center gap-2">
                <button type="button" onclick="fillCustomerDemo()" class="btn btn-outline-secondary btn-sm px-2 py-0.5" style="font-size: 0.75rem;">Customer: rohan_raj / pass123</button>
                <button type="button" onclick="fillAdminDemo()" class="btn btn-outline-warning btn-sm px-2 py-0.5" style="font-size: 0.75rem;">Admin: admin / admin123</button>
            </div>
        </div>

        <p class="text-center mb-0 small text-secondary">
            Don't have an account? <a href="/register" class="fw-semibold text-primary text-decoration-none">Create Account</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function fillCustomerDemo() {
            document.getElementsByName('username')[0].value = 'rohan_raj';
            document.getElementsByName('password')[0].value = 'pass123';
        }
        function fillAdminDemo() {
            document.getElementsByName('username')[0].value = 'admin';
            document.getElementsByName('password')[0].value = 'admin123';
        }
    </script>
</body>
</html>
