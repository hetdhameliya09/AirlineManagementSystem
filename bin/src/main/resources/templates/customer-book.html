<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Flight | SkyWays</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7fc; }
        .card-custom { border-radius: 20px; border: none; box-shadow: 0 12px 30px rgba(0,0,0,0.06); }
        .seat-btn { width: 44px; height: 44px; border-radius: 10px; font-weight: 600; font-size: 0.85rem; }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-plane-departure text-info me-2"></i>SkyWays Airlines</a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <a href="/customer/dashboard" class="btn btn-outline-light btn-sm rounded-pill"><i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container py-4 max-w-900" style="max-width: 900px;">

        <div class="row g-4">
            
            <!-- Flight Overview Card -->
            <div class="col-md-5">
                <div class="card card-custom p-4 bg-white">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-plane-circle-check text-primary me-2"></i> Flight Summary</h5>
                    <div class="p-3 bg-light rounded-3 mb-3">
                        <div class="d-flex justify-content-between mb-1">
                            <strong class="fs-5 text-dark" th:text="${flight.flightNumber}">AI-101</strong>
                            <span class="badge bg-primary-subtle text-primary" th:text="${flight.airlineName}">Air India</span>
                        </div>
                        <hr class="my-2">
                        <div class="row g-2 text-secondary small">
                            <div class="col-6">
                                <span class="d-block text-muted">From</span>
                                <strong class="text-dark fs-6" th:text="${flight.departureAirport}">Delhi</strong>
                                <div th:text="${flight.departureTime}">08:00</div>
                            </div>
                            <div class="col-6 text-end">
                                <span class="d-block text-muted">To</span>
                                <strong class="text-dark fs-6" th:text="${flight.arrivalAirport}">Mumbai</strong>
                                <div th:text="${flight.arrivalTime}">10:15</div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center p-3 border rounded-3 bg-success bg-opacity-10">
                        <span class="fw-medium text-dark">Ticket Fare (1 Passenger)</span>
                        <h4 class="fw-bold text-success mb-0" th:text="'₹' + ${flight.price}">₹5,500</h4>
                    </div>
                </div>
            </div>

            <!-- Booking Form Card -->
            <div class="col-md-7">
                <div class="card card-custom p-4 bg-white">
                    <h4 class="fw-bold mb-3"><i class="fa-solid fa-user-pen text-primary me-2"></i> Passenger & Seat Details</h4>

                    <form method="post" action="/customer/book">
                        <input type="hidden" name="flightId" th:value="${flight.flightId}" />

                        <div class="mb-3">
                            <label class="form-label text-secondary fw-medium small">Passenger Full Name</label>
                            <input type="text" name="passengerName" th:value="${customer.name}" class="form-control bg-light" required />
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label text-secondary fw-medium small">Age</label>
                                <input type="number" name="passengerAge" value="28" min="1" max="100" class="form-control bg-light" required />
                            </div>
                            <div class="col-6">
                                <label class="form-label text-secondary fw-medium small">Gender</label>
                                <select name="passengerGender" class="form-select bg-light">
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>

                        <!-- Seat Picker -->
                        <div class="mb-3">
                            <label class="form-label text-secondary fw-medium small d-block">Select Preferred Seat</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fa-solid fa-chair text-primary"></i></span>
                                <select name="seatNumber" id="seatSelector" class="form-select bg-light" required>
                                    <option value="12A">12A (Window)</option>
                                    <option value="12B">12B (Middle)</option>
                                    <option value="12C">12C (Aisle)</option>
                                    <option value="14A">14A (Window)</option>
                                    <option value="14C">14C (Aisle)</option>
                                    <option value="18F">18F (Window)</option>
                                    <option value="20D">20D (Aisle)</option>
                                </select>
                            </div>
                        </div>

                        <!-- Payment Method -->
                        <div class="mb-4">
                            <label class="form-label text-secondary fw-medium small">Select Payment Mode</label>
                            <div class="row g-2">
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="paymentMethod" id="pay1" value="UPI" checked>
                                    <label class="btn btn-outline-secondary w-100 text-start py-2" for="pay1"><i class="fa-solid fa-mobile-screen me-2 text-primary"></i> UPI / QR Code</label>
                                </div>
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="paymentMethod" id="pay2" value="Credit Card">
                                    <label class="btn btn-outline-secondary w-100 text-start py-2" for="pay2"><i class="fa-solid fa-credit-card me-2 text-success"></i> Credit / Debit Card</label>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-bold fs-6 shadow-sm">
                            <i class="fa-solid fa-lock me-2"></i> Confirm Booking & Pay <span th:text="'₹' + ${flight.price}">₹5,500</span>
                        </button>
                    </form>
                </div>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
