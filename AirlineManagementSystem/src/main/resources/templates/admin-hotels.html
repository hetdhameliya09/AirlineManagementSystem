<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Manage Hotels</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Manage Hotels</h3>
        <a class="btn btn-dark" href="/admin/dashboard">Back to dashboard</a>
    </div>

    <div class="card p-4 mb-4">
        <h5>Add new hotel</h5>
        <form method="post" action="/admin/hotels" th:object="${hotel}" class="row g-3">
            <div class="col-md-3"><input class="form-control" type="text" th:field="*{hotelName}" placeholder="Hotel Name" required /></div>
            <div class="col-md-3"><input class="form-control" type="text" th:field="*{city}" placeholder="City" required /></div>
            <div class="col-md-2"><input class="form-control" type="number" step="0.01" th:field="*{pricePerNight}" placeholder="Per Night" required /></div>
            <div class="col-md-2"><input class="form-control" type="number" th:field="*{availableRooms}" placeholder="Rooms" required /></div>
            <div class="col-md-1"><input class="form-control" type="number" step="0.1" th:field="*{rating}" placeholder="Rating" required /></div>
            <div class="col-md-1 d-grid"><button class="btn btn-primary" type="submit">Save</button></div>
        </form>
    </div>

    <div class="card p-4">
        <table class="table table-striped align-middle">
            <thead class="table-dark">
            <tr><th>ID</th><th>Name</th><th>City</th><th>Price/Night</th><th>Rooms</th><th>Rating</th></tr>
            </thead>
            <tbody>
            <tr th:each="hotel : ${hotels}">
                <td th:text="${hotel.hotelId}"></td>
                <td th:text="${hotel.hotelName}"></td>
                <td th:text="${hotel.city}"></td>
                <td th:text="'₹' + ${hotel.pricePerNight}"></td>
                <td th:text="${hotel.availableRooms}"></td>
                <td th:text="${hotel.rating}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
