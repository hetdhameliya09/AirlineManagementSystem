<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin/dashboard">Admin Dashboard</a>
        <div class="ms-auto d-flex gap-2">
            <a class="btn btn-outline-light" href="/admin/flights">Flights</a>
            <a class="btn btn-outline-light" href="/admin/hotels">Hotels</a>
            <a class="btn btn-outline-light" href="/admin/taxis">Taxis</a>
            <a class="btn btn-light" href="/logout">Logout</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <div class="row g-4 mb-4">
        <div class="col-md-3"><div class="card p-3"><h6>Customers</h6><h3 th:text="${#lists.size(customers)}">0</h3></div></div>
        <div class="col-md-3"><div class="card p-3"><h6>Flights</h6><h3 th:text="${#lists.size(flights)}">0</h3></div></div>
        <div class="col-md-3"><div class="card p-3"><h6>Hotels</h6><h3 th:text="${#lists.size(hotels)}">0</h3></div></div>
        <div class="col-md-3"><div class="card p-3"><h6>Taxis</h6><h3 th:text="${#lists.size(taxis)}">0</h3></div></div>
    </div>

    <div class="card p-4">
        <h4 class="mb-3">Customers</h4>
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                <tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th></tr>
                </thead>
                <tbody>
                <tr th:each="customer : ${customers}">
                    <td th:text="${customer.customerId}"></td>
                    <td th:text="${customer.name}"></td>
                    <td th:text="${customer.email}"></td>
                    <td th:text="${customer.phone}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
