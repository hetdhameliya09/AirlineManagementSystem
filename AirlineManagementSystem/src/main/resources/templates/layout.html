<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${pageTitle} ?: 'Airline Management System'">Airline Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <style>
        body { background: #f5f7fb; }
        .navy { background: linear-gradient(135deg, #0d1b4d, #173c8c); }
        .card { border: none; border-radius: 16px; box-shadow: 0 10px 30px rgba(13,27,77,0.08); }
        .stat-box { background: #fff; border-radius: 14px; padding: 1.2rem; }
        .btn-primary { background: #173c8c; border-color: #173c8c; }
        .btn-primary:hover { background: #0d1b4d; border-color: #0d1b4d; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navy">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Airline System</a>
        <div class="ms-auto d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" href="/">Home</a>
            <a class="btn btn-outline-light btn-sm" href="/login">Login</a>
            <a class="btn btn-outline-light btn-sm" href="/register">Register</a>
            <a class="btn btn-light btn-sm" href="/logout">Logout</a>
        </div>
    </div>
</nav>
<div class="container py-4" th:replace="${contentTemplate}">
</div>
</body>
</html>
