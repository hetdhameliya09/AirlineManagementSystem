<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Manage Taxis</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Manage Taxis</h3>
        <a class="btn btn-dark" href="/admin/dashboard">Back to dashboard</a>
    </div>

    <div class="card p-4 mb-4">
        <h5>Add new taxi</h5>
        <form method="post" action="/admin/taxis" th:object="${taxi}" class="row g-3">
            <div class="col-md-3"><input class="form-control" type="text" th:field="*{driverName}" placeholder="Driver Name" required /></div>
            <div class="col-md-3"><input class="form-control" type="text" th:field="*{phoneNumber}" placeholder="Phone Number" required /></div>
            <div class="col-md-2"><input class="form-control" type="text" th:field="*{vehicleNumber}" placeholder="Vehicle Number" required /></div>
            <div class="col-md-2"><input class="form-control" type="text" th:field="*{vehicleType}" placeholder="Vehicle Type" required /></div>
            <div class="col-md-1"><input class="form-control" type="number" step="0.01" th:field="*{pricePerKm}" placeholder="₹/Km" required /></div>
            <div class="col-md-1"><input class="form-control" type="text" th:field="*{status}" placeholder="Status" required /></div>
            <div class="col-md-12 d-grid"><button class="btn btn-primary" type="submit">Save Taxi</button></div>
        </form>
    </div>

    <div class="card p-4">
        <table class="table table-striped align-middle">
            <thead class="table-dark">
            <tr><th>ID</th><th>Driver</th><th>Phone</th><th>Vehicle</th><th>Type</th><th>Rate</th><th>Status</th></tr>
            </thead>
            <tbody>
            <tr th:each="taxi : ${taxis}">
                <td th:text="${taxi.taxiId}"></td>
                <td th:text="${taxi.driverName}"></td>
                <td th:text="${taxi.phoneNumber}"></td>
                <td th:text="${taxi.vehicleNumber}"></td>
                <td th:text="${taxi.vehicleType}"></td>
                <td th:text="'₹' + ${taxi.pricePerKm} + '/km'"></td>
                <td th:text="${taxi.status}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
