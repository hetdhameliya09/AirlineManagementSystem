<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | SkyWays Airlines</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0b132b 0%, #1c2541 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .register-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            max-width: 580px;
            width: 100%;
            padding: 2.5rem;
        }
        .btn-sky { background-color: #00b4d8; color: #ffffff; font-weight: 600; border-radius: 12px; }
        .btn-sky:hover { background-color: #0077b6; color: #ffffff; }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="text-center mb-4">
            <a href="/" class="text-decoration-none">
                <div class="fs-2 text-primary fw-extrabold mb-1"><i class="fa-solid fa-plane-departure"></i> SkyWays</div>
            </a>
            <h4 class="fw-bold text-dark mb-1">Create Customer Account</h4>
            <p class="text-secondary small">Join SkyWays for easy flight booking and travel rewards.</p>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 text-start small mb-4">
            <i class="fa-solid fa-triangle-exclamation me-1"></i> <span th:text="${error}">Error creating account</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form method="post" action="/register" th:object="${customer}">
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label text-secondary fw-medium small">Username</label>
                    <input type="text" th:field="*{username}" class="form-control bg-light" placeholder="e.g. alex_smith" required />
                </div>
                <div class="col-md-6">
                    <label class="form-label text-secondary fw-medium small">Password</label>
                    <input type="password" th:field="*{password}" class="form-control bg-light" placeholder="Create password" required />
                </div>
                <div class="col-md-12">
                    <label class="form-label text-secondary fw-medium small">Full Name</label>
                    <input type="text" th:field="*{name}" class="form-control bg-light" placeholder="e.g. Alex Smith" required />
                </div>
                <div class="col-md-6">
                    <label class="form-label text-secondary fw-medium small">Email Address</label>
                    <input type="email" th:field="*{email}" class="form-control bg-light" placeholder="alex@example.com" required />
                </div>
                <div class="col-md-6">
                    <label class="form-label text-secondary fw-medium small">Phone Number</label>
                    <input type="text" th:field="*{phone}" class="form-control bg-light" placeholder="+91-9876543210" required />
                </div>
                <div class="col-md-12">
                    <label class="form-label text-secondary fw-medium small">Passport Number</label>
                    <input type="text" th:field="*{passportNumber}" class="form-control bg-light" placeholder="e.g. Z9876543" required />
                </div>
            </div>

            <button type="submit" class="btn btn-sky w-100 py-2.5 fs-6 shadow-sm mb-3">
                <i class="fa-solid fa-user-check me-2"></i> Register Account
            </button>
        </form>

        <p class="text-center mb-0 small text-secondary">
            Already have an account? <a href="/login" class="fw-semibold text-primary text-decoration-none">Log In</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
