<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Book Flight</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card p-4 mx-auto" style="max-width: 700px;">
        <h3 class="mb-3">Book Flight</h3>
        <div class="alert alert-info">
            <strong th:text="${flight.flightNumber}">AI-101</strong> • <span th:text="${flight.airlineName}">Air India</span>
            <div th:text="${flight.departureAirport + ' → ' + flight.arrivalAirport}"></div>
        </div>
        <form method="post" action="/customer/book" th:object="${booking}">
            <input type="hidden" name="flightId" th:value="${flight.flightId}" />
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Booking Date</label>
                    <input class="form-control" type="date" th:field="*{bookingDate}" required />
                </div>
                <div class="col-md-6">
                    <label class="form-label">Total Amount</label>
                    <input class="form-control" type="number" step="0.01" th:field="*{totalAmount}" th:value="${flight.price}" required />
                </div>
            </div>
            <div class="d-flex justify-content-between mt-4">
                <a class="btn btn-outline-secondary" href="/customer/dashboard">Cancel</a>
                <button class="btn btn-primary" type="submit">Confirm Booking</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
