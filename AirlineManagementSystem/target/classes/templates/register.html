<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 shadow-sm">
                <h3 class="mb-3 text-center">Customer Registration</h3>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <form method="post" action="/register" th:object="${customer}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Username</label>
                            <input type="text" th:field="*{username}" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Password</label>
                            <input type="password" th:field="*{password}" class="form-control" required />
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Full Name</label>
                            <input type="text" th:field="*{name}" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" th:field="*{email}" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input type="text" th:field="*{phone}" class="form-control" required />
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Passport Number</label>
                            <input type="text" th:field="*{passportNumber}" class="form-control" required />
                        </div>
                    </div>
                    <button class="btn btn-primary w-100 mt-4">Register</button>
                </form>
                <p class="mt-3 text-center"><a href="/login">Already have an account?</a></p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
