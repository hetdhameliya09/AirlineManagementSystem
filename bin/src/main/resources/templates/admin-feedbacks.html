<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Reviews | SkyWays Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7fc; }
        .sidebar { background: #0b132b; color: #ffffff; min-height: 100vh; }
        .sidebar .nav-link { color: #a0aec0; font-weight: 500; border-radius: 10px; margin-bottom: 0.2rem; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #1c2541; color: #00b4d8; font-weight: 600; }
        .card-custom { border-radius: 16px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar p-3" style="width: 260px;">
            <a href="/" class="d-flex align-items-center gap-2 text-white text-decoration-none fs-4 fw-extrabold mb-4 px-2">
                <i class="fa-solid fa-plane-departure text-info"></i> SkyWays Admin
            </a>

            <div class="nav flex-column">
                <a class="nav-link" href="/admin/dashboard"><i class="fa-solid fa-chart-line me-2"></i> Dashboard Overview</a>
                <a class="nav-link" href="/admin/flights"><i class="fa-solid fa-plane me-2"></i> Manage Flights</a>
                <a class="nav-link" href="/admin/airports"><i class="fa-solid fa-city me-2"></i> Manage Airports</a>
                <a class="nav-link" href="/admin/bookings"><i class="fa-solid fa-receipt me-2"></i> Bookings & Tickets</a>
                <a class="nav-link" href="/admin/customers"><i class="fa-solid fa-users me-2"></i> Customer Directory</a>
                <a class="nav-link" href="/admin/hotels"><i class="fa-solid fa-hotel me-2"></i> Manage Hotels</a>
                <a class="nav-link" href="/admin/taxis"><i class="fa-solid fa-taxi me-2"></i> Taxi Fleet</a>
                <a class="nav-link" href="/admin/notifications"><i class="fa-solid fa-bullhorn me-2"></i> System Alerts</a>
                <a class="nav-link active" href="/admin/feedbacks"><i class="fa-solid fa-star me-2"></i> Customer Reviews</a>
            </div>

            <div class="mt-auto pt-4 border-top border-secondary px-2">
                <a href="/logout" class="btn btn-outline-danger btn-sm w-100 rounded-pill"><i class="fa-solid fa-power-off me-1"></i> Admin Logout</a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-grow-1 p-4">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0"><i class="fa-solid fa-star text-warning me-2"></i> Customer Feedback & Reviews</h3>
            </div>

            <div class="card card-custom p-4 bg-white">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Customer ID</th>
                                <th>Rating</th>
                                <th>Comments & Review</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="fb : ${feedbacks}">
                                <td><strong th:text="'Customer #' + ${fb.customerId}">Customer #1</strong></td>
                                <td>
                                    <span class="badge bg-warning text-dark"><i class="fa-solid fa-star me-1"></i><span th:text="${fb.rating}">5</span> Stars</span>
                                </td>
                                <td class="fw-medium text-dark" th:text="${fb.comments}">Great service!</td>
                                <td class="small text-secondary" th:text="${fb.createdAt}">2026-08-30</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
