<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Customer Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/customer/dashboard">Welcome, <span th:text="${customer.name}">Customer</span></a>
        <div class="ms-auto d-flex gap-2">
            <a class="btn btn-outline-light" href="/">Home</a>
            <a class="btn btn-light" href="/logout">Logout</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <div class="row g-4 mb-4">
        <div class="col-md-6">
            <div class="card p-4 h-100">
                <h4>Available Flights</h4>
                <div class="list-group mt-3">
                    <a class="list-group-item list-group-item-action" th:each="flight : ${flights}" th:href="@{/customer/book/{id}(id=${flight.flightId})}">
                        <div class="d-flex justify-content-between">
                            <strong th:text="${flight.flightNumber}">AI-101</strong>
                            <span class="text-success" th:text="'₹' + ${flight.price}">₹5500</span>
                        </div>
                        <div class="text-secondary" th:text="${flight.departureAirport + ' → ' + flight.arrivalAirport}"></div>
                    </a>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-4 h-100">
                <h4>My Bookings</h4>
                <div class="mt-3">
                    <div class="alert alert-info" th:if="${#lists.isEmpty(bookings)}">No bookings yet.</div>
                    <ul class="list-group" th:unless="${#lists.isEmpty(bookings)}">
                        <li class="list-group-item" th:each="booking : ${bookings}">
                            <strong>Booking #<span th:text="${booking.bookingId}"></span></strong>
                            <div class="text-secondary" th:text="${booking.bookingDate} + ' • ' + ${booking.status}"></div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="card p-4">
        <h4>Travel offers</h4>
        <div class="row g-3 mt-2">
            <div class="col-md-4" th:each="hotel : ${hotels}">
                <div class="border rounded p-3 h-100">
                    <h5 th:text="${hotel.hotelName}"></h5>
                    <p class="mb-1 text-secondary" th:text="${hotel.city}"></p>
                    <p class="mb-0"><strong th:text="'₹' + ${hotel.pricePerNight} + '/night'"></strong></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
