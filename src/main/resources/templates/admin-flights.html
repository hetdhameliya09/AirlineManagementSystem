<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Manage Flights</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Manage Flights</h3>
        <a class="btn btn-dark" href="/admin/dashboard">Back to dashboard</a>
    </div>

    <div class="card p-4 mb-4">
        <h5>Add new flight</h5>
        <form method="post" action="/admin/flights" th:object="${flight}" class="row g-3">
            <div class="col-md-3"><input class="form-control" type="text" th:field="*{flightNumber}" placeholder="Flight Number" required /></div>
            <div class="col-md-3"><input class="form-control" type="text" th:field="*{airlineName}" placeholder="Airline Name" required /></div>
            <div class="col-md-3"><input class="form-control" type="text" th:field="*{departureAirport}" placeholder="Departure Airport" required /></div>
            <div class="col-md-3"><input class="form-control" type="text" th:field="*{arrivalAirport}" placeholder="Arrival Airport" required /></div>
            <div class="col-md-3"><input class="form-control" type="text" th:field="*{departureTime}" placeholder="Departure Time" required /></div>
            <div class="col-md-3"><input class="form-control" type="text" th:field="*{arrivalTime}" placeholder="Arrival Time" required /></div>
            <div class="col-md-2"><input class="form-control" type="number" step="0.01" th:field="*{price}" placeholder="Price" required /></div>
            <div class="col-md-2"><input class="form-control" type="number" th:field="*{availableSeats}" placeholder="Seats" required /></div>
            <div class="col-md-2 d-grid"><button class="btn btn-primary" type="submit">Save</button></div>
        </form>
    </div>

    <div class="card p-4">
        <table class="table table-striped align-middle">
            <thead class="table-dark">
            <tr><th>ID</th><th>Flight</th><th>Airline</th><th>Route</th><th>Price</th><th>Seats</th><th>Action</th></tr>
            </thead>
            <tbody>
            <tr th:each="flight : ${flights}">
                <td th:text="${flight.flightId}"></td>
                <td th:text="${flight.flightNumber}"></td>
                <td th:text="${flight.airlineName}"></td>
                <td th:text="${flight.departureAirport + ' → ' + flight.arrivalAirport}"></td>
                <td th:text="'₹' + ${flight.price}"></td>
                <td th:text="${flight.availableSeats}"></td>
                <td>
                    <form method="post" th:action="@{/admin/flights/delete/{id}(id=${flight.flightId})}">
                        <button class="btn btn-sm btn-danger" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
